{% extends "base.html" %}
{% block title %}Something went wrong{% endblock %}
{% block content %}

    <div class="empty-icon">☁</div>
    <span class="section-kicker">Forecast unavailable</span>
    <h1>We couldn't find that sky.</h1>

</div>
{% endblock %}
